<!DOCTYPE html>
<!-- 网页骨架 · 宣传落地页（一屏讲清一件事：痛点 → 方案 → 行动）
     用法：整份照抄，只替换双花括号占位符里的文字与 :root 里的色值，不要改结构、不要重写 CSS。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{页面标题}}</title>
<style>
:root{
{{配色变量}}
  --wrap:880px;--radius:16px;
  --f:"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f);font-size:16px;
  line-height:1.75;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px}
.btn{display:inline-block;padding:12px 26px;border-radius:999px;background:var(--primary);
  color:var(--bg);font-weight:600;font-size:15px}
.btn.ghost{background:transparent;color:var(--text);
  border:1px solid color-mix(in srgb,var(--text) 26%,transparent)}

.hero{padding:72px 0 56px;text-align:center;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:-40% -30% auto -30%;height:460px;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--primary) 24%,transparent),transparent)}
.hero .wrap{position:relative}
.kicker{font-size:13px;letter-spacing:2px;color:var(--primary);margin-bottom:16px}
.hero h1{font-size:36px;line-height:1.28;font-weight:700;letter-spacing:-.6px}
.hero p.lead{margin-top:18px;color:var(--muted);font-size:17px;max-width:560px;
  margin-left:auto;margin-right:auto}
.hero .acts{margin-top:32px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

section{padding:48px 0}
h2{font-size:23px;font-weight:700;letter-spacing:-.3px;margin-bottom:8px}
.sec-sub{color:var(--muted);font-size:15px;margin-bottom:30px}

.pains{display:grid;gap:12px}
.pain{background:var(--card);border-radius:var(--radius);padding:18px 20px;
  border-left:3px solid var(--primary);font-size:15px}

.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.step{background:var(--card);border-radius:var(--radius);padding:24px 20px;
  border:1px solid color-mix(in srgb,var(--text) 8%,transparent)}
.step .n{font-size:13px;font-weight:700;color:var(--primary);letter-spacing:1px}
.step h3{font-size:17px;margin:10px 0 8px;font-weight:600}
.step p{font-size:14px;color:var(--muted)}

.cta{margin:20px 0 60px}
.cta .box{background:var(--card);border-radius:var(--radius);padding:40px 24px;text-align:center;
  border:1px solid color-mix(in srgb,var(--primary) 24%,transparent)}
.cta h2{font-size:24px}
.cta p{margin-top:12px;color:var(--muted)}
.cta .btn{margin-top:26px}

footer{border-top:1px solid color-mix(in srgb,var(--text) 10%,transparent);
  padding:30px 0 40px;font-size:13px;color:var(--muted);text-align:center}

@media (max-width:640px){
  .hero{padding:48px 0 40px}
  .hero h1{font-size:27px}
  .hero p.lead{font-size:15px}
  section{padding:34px 0}
  h2{font-size:20px}
}
</style>
</head>
<body>

<div class="hero">
  <div class="wrap">
    <div class="kicker">{{角标}}</div>
    <h1>{{主标题}}</h1>
    <p class="lead">{{副标题}}</p>
    <div class="acts">
      <a href="#action" class="btn">{{主按钮}}</a>
      <a href="#how" class="btn ghost">{{次按钮}}</a>
    </div>
  </div>
</div>

<section id="pain">
  <div class="wrap">
    <h2>{{痛点区标题}}</h2>
    <p class="sec-sub">{{痛点区副标题}}</p>
    <div class="pains">
      <div class="pain">{{痛点1}}</div>
      <div class="pain">{{痛点2}}</div>
      <div class="pain">{{痛点3}}</div>
    </div>
  </div>
</section>

<section id="how">
  <div class="wrap">
    <h2>{{方案区标题}}</h2>
    <p class="sec-sub">{{方案区副标题}}</p>
    <div class="steps">
      <div class="step">
        <div class="n">01</div>
        <h3>{{步骤1标题}}</h3>
        <p>{{步骤1说明}}</p>
      </div>
      <div class="step">
        <div class="n">02</div>
        <h3>{{步骤2标题}}</h3>
        <p>{{步骤2说明}}</p>
      </div>
      <div class="step">
        <div class="n">03</div>
        <h3>{{步骤3标题}}</h3>
        <p>{{步骤3说明}}</p>
      </div>
    </div>
  </div>
</section>

<div class="cta" id="action">
  <div class="wrap">
    <div class="box">
      <h2>{{行动号召标题}}</h2>
      <p>{{行动号召说明}}</p>
      <a href="tel:{{联系电话}}" class="btn">{{行动号召按钮}}</a>
    </div>
  </div>
</div>

<footer>
  <div class="wrap">
    {{页脚版权}}<!--可选--><span> · {{联系电话}}</span><!--/可选-->
  </div>
</footer>

</body>
</html>
