org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Windows paths with non-ASCII characters (a Chinese user name, say) make AGP
# refuse to start. It is a warning about a class of tools that mis-handle such
# paths, not a fault in this project: the build is verified to work here.
android.overridePathCheck=true