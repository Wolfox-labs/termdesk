name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pc-agent:
    name: pc-agent static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pc-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install relay dependencies
        # `npm test` also runs the relay's own suite and the relay-backed end-to-end
        # check, and the relay package carries its own dependency (ws).
        working-directory: relay
        run: npm install --no-audit --no-fund
      - name: Syntax, protocol consistency, and the facade pin
        run: npm test

  android:
    name: Android and desktop compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          # compileSdk is 35; the runner image already carries most of this, and
          # this step makes the exact platform present rather than assumed.
          packages: 'platforms;android-35 build-tools;35.0.0'
      - name: Install the agent's dependencies
        # The APK carries the agent's own source (see `syncLocalAgent` in
        # android/app/build.gradle.kts), and that task also stages `ws` out of
        # pc-agent/node_modules. Without this install the asset tree is
        # incomplete and the Android build fails - which is exactly what a
        # fresh checkout looks like, so it is a required step, not a nicety.
        working-directory: pc-agent
        run: npm install --no-audit --no-fund
      - name: Compile the phone app
        # Tee'd to a file so the compiler's own words can be checked afterwards. A warning
        # nobody reads is how a dead `when` branch survived in this project: two identical
        # arms meant the one clearing "sending" never ran, and the send button span for a
        # whole turn. `set -o pipefail` is not the default here, and without it the pipe
        # would hide Gradle's exit code behind tee's.
        shell: bash
        run: set -o pipefail && ./gradlew :app:assembleDebug --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"
        working-directory: android
      - name: Run the phone's unit tests
        # Compiling is not testing: `assembleDebug` does not run them. These are
        # the frame parsers (the only device-free logic on this side) and JUnit
        # fails the job on the first broken assertion.
        #
        # Captured like the builds are: it compiles too, and a step that compiles without
        # its output being read is a step whose warnings nobody will see.
        shell: bash
        run: set -o pipefail && ./gradlew :app:testDebugUnitTest --console=plain 2>&1 | tee -a "$RUNNER_TEMP/gradle-build.log"
        working-directory: android
      - name: Compile the desktop shell
        # `desktop/` is its OWN Gradle build with its own wrapper and settings file -
        # deliberately not a module of the Android project (see its settings.gradle.kts).
        # So it is built from inside that directory, with that directory's `gradlew`.
        #
        # This step used to say `working-directory: android` with `-p desktop`, which
        # resolves to `android/desktop` - a path that has never existed. It would have
        # failed the first time this workflow ran anywhere, which is exactly why the
        # check below is worth having in a job that has never executed.
        shell: bash
        run: set -o pipefail && ./gradlew compileKotlin --console=plain 2>&1 | tee -a "$RUNNER_TEMP/gradle-build.log"
        working-directory: desktop
      - name: No dead branch slipped through
        # The gate for a class of defect that compiles cleanly and behaves wrongly. Kotlin
        # says `Duplicate branch condition` and carries on; here, carrying on is the bug.
        #
        # On a warm build cache the compile task may be FROM-CACHE and print nothing. That
        # is not a hole worth closing with `--rerun-tasks`: a cache hit means this exact
        # source has been compiled before, on a run where this same gate looked at it.
        shell: bash
        run: |
          if grep -q "Duplicate branch condition" "$RUNNER_TEMP/gradle-build.log"; then
            echo "::error::Kotlin reports a duplicate branch condition - one of the when arms is dead code"
            grep -n -B2 -A2 "Duplicate branch condition" "$RUNNER_TEMP/gradle-build.log"
            exit 1
          fi
          echo "no duplicate branch conditions reported"
      - name: Keep the debug APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: termdesk-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
